<style>
  #bg-canvas {

<script>
(function () {
  var canvas = document.getElementById('bg-canvas');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W, H, points, ripples;
  var MAX_DIST = 190;
  var RIPPLE_LIFETIME = 950;
  var RIPPLE_EMIT_DIST = 7;
  var HIT_RADIUS = 26;
  var dragging = null;

  function pointCount(w, h) {
    var area = w * h;
    return Math.max(26, Math.min(70, Math.round(area / 26000)));
  }

  function makePoints(w, h) {
    var n = pointCount(w, h);
    var pts = [];
    for (var i = 0; i < n; i++) {
      var hub = Math.random() < 0.22; // a handful of bigger, brighter "hub" nodes
      pts.push({
        bx: Math.random() * w,
        by: Math.random() * h,
        ax: 35 + Math.random() * 55,
        ay: 35 + Math.random() * 55,
        fx: 0.00008 + Math.random() * 0.00013,
        fy: 0.00008 + Math.random() * 0.00013,
        px: Math.random() * Math.PI * 2,
        py: Math.random() * Math.PI * 2,
        pulsePhase: Math.random() * Math.PI * 2,
        hueOffset: (Math.random() - 0.5) * 140,
        hueSpeed: 0.00004 + Math.random() * 0.00004,
        huePhase: Math.random() * Math.PI * 2,
        lightOffset: (Math.random() - 0.5) * 14,
        hub: hub,
        r: hub ? 3.6 + Math.random() * 1.6 : 1.8 + Math.random() * 1.2,
        lastRippleX: null,
        lastRippleY: null,
        dragging: false,
        x: 0,
        y: 0
      });
    }
    return pts;
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    points = makePoints(W, H);
    ripples = [];
    dragging = null;
  }

  function mix(a, b, t) {
    return a + (b - a) * t;
  }

  function frame(t) {
    ctx.clearRect(0, 0, W, H);

    // base hue drifts slowly through blue -> violet -> teal and back
    var baseHue = 205 + Math.sin(t * 0.00005) * 55;

    for (var i = 0; i < points.length; i++) {
      var p = points[i];
      if (!p.dragging) {
        p.x = p.bx + Math.sin(t * p.fx + p.px) * p.ax;
        p.y = p.by + Math.cos(t * p.fy + p.py) * p.ay;
      }
      p.hue = baseHue + p.hueOffset + Math.sin(t * p.hueSpeed + p.huePhase) * 18;

      if (p.hub || p.dragging) {
        if (p.lastRippleX === null) { p.lastRippleX = p.x; p.lastRippleY = p.y; }
        var rdx = p.x - p.lastRippleX, rdy = p.y - p.lastRippleY;
        if (Math.sqrt(rdx * rdx + rdy * rdy) > RIPPLE_EMIT_DIST) {
          ripples.push({ x: p.x, y: p.y, born: t, hue: p.hue, maxR: 9 + Math.random() * 7 });
          p.lastRippleX = p.x;
          p.lastRippleY = p.y;
        }
      }
    }

    // small fading rings left behind each hub, like skips on water -- drawn first so the network sits on top
    for (var i = ripples.length - 1; i >= 0; i--) {
      var r = ripples[i];
      var age = t - r.born;
      if (age > RIPPLE_LIFETIME) {
        ripples.splice(i, 1);
        continue;
      }
      var progress = age / RIPPLE_LIFETIME;
      var radius = mix(1.5, r.maxR, progress);
      var alpha = 0.4 * Math.pow(1 - progress, 1.3);
      ctx.strokeStyle = 'hsla(' + r.hue.toFixed(1) + ', 90%, 60%, ' + alpha.toFixed(3) + ')';
      ctx.lineWidth = mix(1.3, 0.3, progress);
      ctx.beginPath();
      ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
      ctx.stroke();
    }

    for (var i = 0; i < points.length; i++) {
      for (var j = i + 1; j < points.length; j++) {
        var a = points[i], b = points[j];
        var dx = a.x - b.x, dy = a.y - b.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MAX_DIST) {
          var closeness = 1 - dist / MAX_DIST;
          var hue = (a.hue + b.hue) / 2;
          var sat = mix(32, 92, closeness);
          var light = mix(62, 56, closeness);
          var alpha = 0.07 + closeness * 0.42;
          ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ', ' + sat.toFixed(0) + '%, ' + light.toFixed(0) + '%, ' + alpha.toFixed(3) + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    for (var i = 0; i < points.length; i++) {
      var p = points[i];
      var pulse = 0.85 + Math.sin(t * 0.0009 + p.pulsePhase) * 0.15;
      var radius = (p.dragging ? p.r * 1.6 : p.r) * pulse;
      var nodeLight = 58 + p.lightOffset;
      var nodeColor = 'hsla(' + p.hue.toFixed(1) + ', 92%, ' + nodeLight.toFixed(0) + '%, ';

      if (p.hub || p.dragging) {
        ctx.save();
        ctx.shadowColor = nodeColor + '0.8)';
        ctx.shadowBlur = p.dragging ? 16 : 11;
        ctx.fillStyle = nodeColor + '0.9)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle = nodeColor + '0.55)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  var running = false;
  function loop(t) {
    if (!running) return;
    frame(t);
    requestAnimationFrame(loop);
  }

  function start() {
    if (running) return;
    running = true;
    requestAnimationFrame(loop);
  }
  function stop() {
    running = false;
  }

  function redrawIfStatic() {
    if (!running) frame(performance.now());
  }

  function findNearest(mx, my) {
    var best = null, bestDist = HIT_RADIUS;
    for (var i = 0; i < points.length; i++) {
      var p = points[i];
      var dx = p.x - mx, dy = p.y - my;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestDist) {
        bestDist = d;
        best = p;
      }
    }
    return best;
  }

  function releaseDrag() {
    if (!dragging) return;
    var t = performance.now();
    // hand the point back to its orbit, centered wherever it was dropped -- no snap
    dragging.bx = dragging.x - Math.sin(t * dragging.fx + dragging.px) * dragging.ax;
    dragging.by = dragging.y - Math.cos(t * dragging.fy + dragging.py) * dragging.ay;
    dragging.dragging = false;
    dragging = null;
    document.body.style.cursor = '';
    redrawIfStatic();
  }

  function onPointerDown(e) {
    var hit = findNearest(e.clientX, e.clientY);
    if (hit) {
      dragging = hit;
      dragging.dragging = true;
      document.body.style.cursor = 'grabbing';
      e.preventDefault();
    }
  }

  function onPointerMove(e) {
    if (dragging) {
      dragging.x = Math.max(0, Math.min(W, e.clientX));
      dragging.y = Math.max(0, Math.min(H, e.clientY));
      e.preventDefault();
      redrawIfStatic();
    } else {
      document.body.style.cursor = findNearest(e.clientX, e.clientY) ? 'grab' : '';
    }
  }

  window.addEventListener('pointerdown', onPointerDown, { passive: false });
  window.addEventListener('pointermove', onPointerMove, { passive: false });
  window.addEventListener('pointerup', releaseDrag, { passive: false });
  window.addEventListener('pointercancel', releaseDrag, { passive: false });
  window.addEventListener('mousedown', onPointerDown, { passive: false });
  window.addEventListener('mousemove', onPointerMove, { passive: false });
  window.addEventListener('mouseup', releaseDrag, { passive: false });
  window.addEventListener('blur', releaseDrag);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else if (!reduceMotion) start();
  });

  window.addEventListener('resize', resize);

  resize();
  if (reduceMotion) {
    frame(0);
  } else {
    start();
  }
})();
</script>

  const isCodeAnnotation = (el) => {
    for (const clz of el.classList) {
      if (clz.startsWith('code-annotation-')) {                     
        return true;
      }
    }
    return false;
  }
  const clipboard = new window.ClipboardJS('.code-copy-button', {
    text: function(trigger) {
      const codeEl = trigger.previousElementSibling.cloneNode(true);
      for (const childEl of codeEl.children) {
        if (isCodeAnnotation(childEl)) {
          childEl.remove();
        }
      }
      return codeEl.innerText;
    }
  });
  clipboard.on('success', function(e) {
    // button target
    const button = e.trigger;
    // don't keep focus
    button.blur();
    // flash "checked"
    button.classList.add('code-copy-button-checked');
    var currentTitle = button.getAttribute("title");
    button.setAttribute("title", "Copied!");
    let tooltip;
    if (window.bootstrap) {
      button.setAttribute("data-bs-toggle", "tooltip");
      button.setAttribute("data-bs-placement", "left");
      button.setAttribute("data-bs-title", "Copied!");
      tooltip = new bootstrap.Tooltip(button, 
        { trigger: "manual", 
          customClass: "code-copy-button-tooltip",
          offset: [0, -8]});
      tooltip.show();    
    }
    setTimeout(function() {
      if (tooltip) {
        tooltip.hide();
        button.removeAttribute("data-bs-title");
        button.removeAttribute("data-bs-toggle");
        button.removeAttribute("data-bs-placement");
      }
      button.setAttribute("title", currentTitle);
      button.classList.remove('code-copy-button-checked');
    }, 1000);
    // clear code selection
    e.clearSelection();
  });
  function tippyHover(el, contentFn) {
    const config = {
      allowHTML: true,

      interactive: true,

      theme: 'quarto',
      placement: 'bottom-start'
    };
    window.tippy(el, config); 
  }
  const noterefs = window.document.querySelectorAll('a[role="doc-noteref"]');
  for (var i=0; i<noterefs.length; i++) {
    const ref = noterefs[i];
    tippyHover(ref, function() {
      // use id or data attribute instead here

      const note = window.document.getElementById(id);
      return note.innerHTML;
    });
  }
      let selectedAnnoteEl;
      const selectorForAnnotation = ( cell, annotation) => {
        let cellAttr = 'data-code-cell="' + cell + '"';
        let lineAttr = 'data-code-annotation="' +  annotation + '"';
        const selector = 'span[' + cellAttr + '][' + lineAttr + ']';
        return selector;
      }
      const selectCodeLines = (annoteEl) => {
        const doc = window.document;
        const targetCell = annoteEl.getAttribute("data-target-cell");
        const targetAnnotation = annoteEl.getAttribute("data-target-annotation");
        const annoteSpan = window.document.querySelector(selectorForAnnotation(targetCell, targetAnnotation));
        const lines = annoteSpan.getAttribute("data-code-lines").split(",");
        const lineIds = lines.map((line) => {
          return targetCell + "-" + line;
        })
        let top = null;
        let height = null;
        let parent = null;
        if (lineIds.length > 0) {
            //compute the position of the single el (top and bottom and make a div)
            const el = window.document.getElementById(lineIds[0]);
            top = el.offsetTop;
            height = el.offsetHeight;
            parent = el.parentElement.parentElement;
          if (lineIds.length > 1) {
            const lastEl = window.document.getElementById(lineIds[lineIds.length - 1]);
            const bottom = lastEl.offsetTop + lastEl.offsetHeight;
            height = bottom - top;
          }
          if (top !== null && height !== null && parent !== null) {
            // cook up a div (if necessary) and position it 
            let div = window.document.getElementById("code-annotation-line-highlight");
            if (div === null) {
              div = window.document.createElement("div");
              div.setAttribute("id", "code-annotation-line-highlight");
              div.style.position = 'absolute';
              parent.appendChild(div);
            }
            div.style.top = top - 2 + "px";
            div.style.height = height + 4 + "px";
            let gutterDiv = window.document.getElementById("code-annotation-line-highlight-gutter");
            if (gutterDiv === null) {
              gutterDiv = window.document.createElement("div");
              gutterDiv.setAttribute("id", "code-annotation-line-highlight-gutter");
              gutterDiv.style.position = 'absolute';
              const codeCell = window.document.getElementById(targetCell);
              const gutter = codeCell.querySelector('.code-annotation-gutter');
              gutter.appendChild(gutterDiv);
            }
            gutterDiv.style.top = top - 2 + "px";
            gutterDiv.style.height = height + 4 + "px";
          }
          selectedAnnoteEl = annoteEl;
        }
      };
      const unselectCodeLines = () => {
        const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];

        });

          if (clickedEl !== selectedAnnoteEl) {
            unselectCodeLines();

            if (activeEl) {
              activeEl.classList.remove('code-annotation-active');
            }
            selectCodeLines(clickedEl);
            clickedEl.classList.add('code-annotation-active');

            clickedEl.classList.remove('code-annotation-active');
          }
        });
      }
  const findCites = (el) => {

      }

          if (biblioDiv) {
            citeDiv.innerHTML = biblioDiv.innerHTML;
          }
          popup.appendChild(citeDiv);
        });
        return popup.innerHTML;
      });
    }
  }
});
